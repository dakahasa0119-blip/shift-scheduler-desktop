name: Web UI checks

on:
  push:
    branches: [feat/authenticated-web-ui-20260906]
  pull_request:
    paths:
      - 'desktop/**'
      - 'solver_cli/**'
      - 'Dockerfile.web'
      - 'render.yaml'
      - 'package.json'
      - '.github/workflows/web-ui-checks.yml'

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solver build dependencies
        run: python -m pip install --disable-pip-version-check -r solver_cli/requirements.txt pyinstaller
      - name: Build bundled Linux solver
        run: npx -y -p tsx tsx desktop/solver/nodeBuildSolver.ts --platform=linux-x64 --force --skip-readiness
      - name: Run existing desktop regression tests
        run: npm test
      - name: Start authenticated web preview
        env:
          WEB_USERNAME: preview
          WEB_PASSWORD: preview-test-password
          PORT: '3080'
        run: |
          npx -y -p tsx tsx desktop/web/publicGateway.ts > /tmp/shift-web.log 2>&1 &
          echo $! > /tmp/shift-web.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Verify authentication and live UI
        run: |
          unauth_status=$(curl -sS -o /tmp/unauth.txt -w '%{http_code}' http://127.0.0.1:3080/)
          test "$unauth_status" = "401"
          curl -fsS -u preview:preview-test-password http://127.0.0.1:3080/ > /tmp/index.html
          grep -q '勤務表' /tmp/index.html
          quit_status=$(curl -sS -u preview:preview-test-password -X POST -o /tmp/quit.txt -w '%{http_code}' http://127.0.0.1:3080/app/quit)
          test "$quit_status" = "403"
      - name: Show gateway log on failure
        if: failure()
        run: cat /tmp/shift-web.log || true
      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/shift-web.pid ]; then
            kill $(cat /tmp/shift-web.pid) || true
          fi
      - name: Package reviewed source for local browser verification
        if: always()
        run: git archive --format=zip --output=reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-source
          path: reviewed-source.zip
          retention-days: 7

  container-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build deployable Docker image
        run: docker build -f Dockerfile.web -t shift-scheduler-web:ci .
      - name: Start Docker image
        run: |
          docker run -d --rm --name shift-scheduler-web-ci \
            -p 3090:3000 \
            -e WEB_USERNAME=preview \
            -e WEB_PASSWORD=preview-test-password \
            shift-scheduler-web:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3090/healthz >/tmp/docker-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/docker-health.json
          grep -q '"ok":true' /tmp/docker-health.json
      - name: Verify authenticated UI in container
        run: |
          unauth_status=$(curl -sS -o /tmp/docker-unauth.txt -w '%{http_code}' http://127.0.0.1:3090/)
          test "$unauth_status" = "401"
          curl -fsS -u preview:preview-test-password http://127.0.0.1:3090/ > /tmp/docker-index.html
          grep -q '勤務表' /tmp/docker-index.html
      - name: Show container logs on failure
        if: failure()
        run: docker logs shift-scheduler-web-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f shift-scheduler-web-ci || true
