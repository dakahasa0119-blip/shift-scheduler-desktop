name: Local LLM - fictional Windows CPU experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-llm-fictional-windows
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EXPERIMENT_RESULTS: ${{ github.workspace }}\llm-results
      # The first run covered all eight cases. Repeat only the monthly case
      # interrupted by the transport's hidden 300-second header timeout.
      EXPERIMENT_CASES: monthly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fault injection and isolation checks
        run: node experiments/local-llm/selftest.cjs
      - name: Explicit response timeout checks
        run: node --test experiments/local-llm/transport.test.cjs
      - name: Verified automatic installation and real model evaluation
        run: node experiments/local-llm/run.cjs
      - name: Preserve only small fictional results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-llm-fictional-results
          path: llm-results/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
